<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Vignesh Murugamoorthy</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #020804;
            color: white;
        }

        /* =========================
           WELCOME VIDEO
        ========================= */

        .welcome-video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;
        }

        /* =========================
           DARK OVERLAY
        ========================= */

        .welcome-overlay {
            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.60)
                );

            z-index: -1;
        }

        /* =========================
           WELCOME CONTENT
        ========================= */

        .welcome-content {

            width: 100%;
            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;
        }

        .welcome-text {

            font-size: clamp(28px, 4vw, 50px);

            font-weight: 600;

            letter-spacing: 1px;

            margin-bottom: 35px;

            text-shadow:
                0 3px 20px rgba(0, 0, 0, 0.8);
        }

        /* =========================
           BUTTON
        ========================= */

        .hit-button {

            display: inline-block;

            padding: 17px 38px;

            border-radius: 12px;

            border: 1px solid rgba(126, 231, 135, 0.7);

            background: rgba(5, 20, 10, 0.45);

            color: #ffffff;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 2px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 20px rgba(126, 231, 135, 0.18);

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .hit-button:hover {

            background: #7ee787;

            color: #061009;

            transform: translateY(-5px);

            box-shadow:
                0 10px 35px rgba(126, 231, 135, 0.45);
        }

        .hit-button:active {

            transform: scale(0.95);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .welcome-text {
                font-size: 30px;
            }

            .hit-button {
                padding: 15px 30px;
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

    <!-- WELCOME VIDEO -->

    <video
        class="welcome-video"
        autoplay
        muted
        loop
        playsinline>

        <source src="Welcome.mp4" type="video/mp4">

    </video>


    <!-- DARK OVERLAY -->

    <div class="welcome-overlay"></div>


    <!-- WELCOME MESSAGE -->

    <div class="welcome-content">

        <div class="welcome-text">
            Easy pal!<br>
            Want to know who I'm?
        </div>

        <a href="index.html" class="hit-button">
            HIT ME
        </a>

    </div>

</body>

</html>
